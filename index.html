<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pixiv 作品直达 · PID 跳转</title>
<meta name="description" content="输入 Pixiv 作品 ID，一键跳转到 pixiv.net/artworks/ 作品页。" />
<meta name="color-scheme" content="light dark" />
<link rel="preload" as="image" href="cover.webp" />
<style>
  :root {
    --sky: #3f9fe0;
    --sky-2: #6ec8f7;
    --pink: #ff6f97;
    --ink: #16233a;
    --muted: #61718d;
    --line: rgba(20, 40, 70, 0.10);
    --panel: rgba(255, 255, 255, 0.88);
    --panel-solid: #ffffff;
    --field: #f4f7fc;
    --field-line: rgba(20, 40, 70, 0.12);
    --bg: #eaf1fa;
    --chip: rgba(20, 40, 70, 0.05);
    --danger: #e0344f;
    --shadow: 0 40px 90px -40px rgba(22, 45, 80, 0.55), 0 2px 8px rgba(22, 45, 80, 0.06);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #eef3ff;
      --muted: #94a3bf;
      --line: rgba(255, 255, 255, 0.10);
      --panel: rgba(15, 23, 40, 0.86);
      --panel-solid: #0f1728;
      --field: rgba(255, 255, 255, 0.05);
      --field-line: rgba(255, 255, 255, 0.14);
      --bg: #070c18;
      --chip: rgba(255, 255, 255, 0.06);
      --danger: #ff7186;
      --shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.9), 0 2px 8px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: clamp(14px, 3.5vw, 48px);
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ambient light behind the card, tinted from the artwork */
  .aura { position: fixed; inset: -15vmax; z-index: 0; pointer-events: none; filter: blur(80px); opacity: 0.75; }
  .aura span { position: absolute; border-radius: 50%; display: block; }
  .aura .a1 { width: 48vmax; height: 48vmax; left: -6%; top: -10%; background: radial-gradient(circle, rgba(110, 200, 247, 0.55), transparent 65%); }
  .aura .a2 { width: 42vmax; height: 42vmax; right: -8%; bottom: -12%; background: radial-gradient(circle, rgba(255, 111, 151, 0.35), transparent 66%); }

  /* ---------- shell ---------- */
  .shell {
    position: relative;
    z-index: 1;
    width: min(1000px, 100%);
    display: grid;
    grid-template-columns: 0.9fr 1.1fr;
    border-radius: 28px;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    backdrop-filter: blur(20px) saturate(130%);
    -webkit-backdrop-filter: blur(20px) saturate(130%);
    animation: rise 0.75s cubic-bezier(0.16, 0.84, 0.28, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(20px) scale(0.99); }
    to { opacity: 1; transform: none; }
  }

  /* ---------- cover ---------- */
  .cover {
    position: relative;
    min-height: 560px;
    overflow: hidden;
    isolation: isolate;
    background: linear-gradient(160deg, #cfe6f8, #f7dbe4);
  }
  .cover img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 20%;
    transform: scale(1.001);
    transition: transform 1.2s cubic-bezier(0.2, 0.7, 0.3, 1);
  }
  .shell:hover .cover img { transform: scale(1.035); }

  .cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(to top, rgba(9, 16, 32, 0.82) 0%, rgba(9, 16, 32, 0.42) 26%, transparent 52%),
      linear-gradient(to right, transparent 62%, rgba(255, 255, 255, 0.10) 100%);
    pointer-events: none;
  }

  .cover-text {
    position: absolute;
    inset: auto 0 0 0;
    padding: clamp(22px, 3vw, 34px);
    color: #fff;
    z-index: 2;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.38);
    background: rgba(255, 255, 255, 0.14);
    backdrop-filter: blur(8px);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .badge i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #6ec8f7;
    box-shadow: 0 0 10px #6ec8f7;
  }
  .cover-text h1 {
    margin: 14px 0 6px;
    font-size: clamp(24px, 2.6vw, 30px);
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
  }
  .cover-text p {
    margin: 0;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.82);
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.4);
  }

  /* ---------- panel ---------- */
  .panel {
    padding: clamp(26px, 3.4vw, 46px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .stack {
    margin: auto 0;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .kicker {
    margin: 0;
    font-size: 11px;
    font-weight: 650;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  form { margin: 0; }

  .field {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 64px;
    padding: 0 14px;
    border-radius: 16px;
    background: var(--field);
    border: 1.5px solid var(--field-line);
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    cursor: text;
  }
  .field:focus-within {
    border-color: var(--sky);
    box-shadow: 0 0 0 4px rgba(63, 159, 224, 0.16);
    background: var(--panel-solid);
  }
  .field.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(224, 52, 79, 0.12); }
  .field.shake { animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .prefix {
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: clamp(12px, 1.6vw, 14px);
    color: var(--muted);
    white-space: nowrap;
    user-select: none;
  }

  #pid {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 4px 0 2px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: clamp(18px, 2.6vw, 22px);
    font-weight: 600;
    letter-spacing: 0.02em;
    outline: none;
  }
  #pid::placeholder { color: var(--muted); opacity: 0.55; font-weight: 500; }

  .clear {
    flex: none;
    width: 27px; height: 27px;
    display: grid; place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--chip);
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .clear[hidden] { display: none; }
  .clear:hover { color: var(--ink); transform: rotate(90deg); }

  .err {
    min-height: 18px;
    margin: 7px 2px 0;
    font-size: 12.5px;
    color: var(--danger);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .err.show { opacity: 1; transform: none; }

  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 4px;
  }

  .switch { display: inline-flex; align-items: center; gap: 9px; font-size: 12.5px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track {
    width: 38px; height: 22px;
    border-radius: 999px;
    background: var(--chip);
    border: 1px solid var(--field-line);
    position: relative;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .thumb {
    position: absolute; top: 2px; left: 2px;
    width: 16px; height: 16px; border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.18s ease;
  }
  .switch input:checked + .track { background: rgba(63, 159, 224, 0.22); border-color: var(--sky); }
  .switch input:checked + .track .thumb { transform: translateX(16px); background: var(--sky); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 4px rgba(63, 159, 224, 0.2); }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 15px 26px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #3f9fe0, #6ec8f7 80%);
    color: #fff;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 650;
    letter-spacing: 0.01em;
    cursor: pointer;
    box-shadow: 0 16px 30px -14px rgba(63, 159, 224, 0.9);
    transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  }
  .go svg { transition: transform 0.18s ease; }
  .go:hover { transform: translateY(-1.5px); filter: brightness(1.04); box-shadow: 0 20px 36px -14px rgba(63, 159, 224, 1); }
  .go:hover svg { transform: translateX(3px); }
  .go:active { transform: translateY(0) scale(0.985); }
  .go:focus-visible { outline: 3px solid rgba(110, 200, 247, 0.6); outline-offset: 3px; }

  /* ---------- history ---------- */
  .history { padding-top: 18px; border-top: 1px dashed var(--field-line); }
  .hist-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 11px; }
  .hist-head h2 {
    margin: 0;
    font-size: 10.5px;
    font-weight: 650;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hist-head button {
    border: 0; background: none; padding: 2px 4px;
    color: var(--muted); font-family: inherit; font-size: 11.5px;
    cursor: pointer; border-radius: 6px;
    transition: color 0.15s ease;
  }
  .hist-head button:hover { color: var(--danger); }

  #histList { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
  #histList button {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 7px 12px;
    border-radius: 999px;
    border: 1px solid var(--field-line);
    background: var(--chip);
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  #histList button:hover { border-color: var(--sky); background: rgba(63, 159, 224, 0.10); transform: translateY(-1px); }
  #histList .hash { color: var(--muted); }

  footer { font-size: 11.5px; line-height: 1.7; color: var(--muted); }
  footer kbd {
    font-family: inherit; font-size: 10.5px;
    padding: 1.5px 6px; border-radius: 5px;
    border: 1px solid var(--field-line);
    background: var(--chip);
    color: var(--ink);
  }

  /* ---------- responsive ---------- */
  @media (max-width: 780px) {
    body { padding: 0; place-items: start center; }
    .shell {
      grid-template-columns: 1fr;
      border-radius: 0;
      border: 0;
      min-height: 100dvh;
      width: 100%;
    }
    .cover { min-height: 46vh; }
    .cover img { object-position: 50% 18%; }
    .panel { padding: 24px 20px 32px; gap: 16px; }
    .go { flex: 1; justify-content: center; }
    .actions { justify-content: stretch; }
  }

  @media (max-width: 380px) {
    .prefix { font-size: 10.5px; letter-spacing: -0.02em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="aura" aria-hidden="true"><span class="a1"></span><span class="a2"></span></div>

  <main class="shell">
    <section class="cover" aria-hidden="true">
      <img src="cover.webp" alt="" fetchpriority="high" />
      <div class="cover-text">
        <span class="badge"><i></i>Pixiv Artwork</span>
        <h1>作品直达</h1>
        <p>输入 PID，一步抵达原作图页</p>
      </div>
    </section>

    <section class="panel">
      <div class="stack">
        <p class="kicker">Artwork ID</p>

        <form id="form" novalidate>
          <label class="field" id="field" for="pid">
            <span class="prefix">pixiv.net/artworks/</span>
            <input id="pid" name="pid" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off"
                   spellcheck="false" placeholder="123456789" aria-describedby="err" autofocus />
            <button class="clear" id="clear" type="button" hidden aria-label="清空输入">×</button>
          </label>
          <p class="err" id="err" role="alert" aria-live="polite"></p>

          <div class="actions">
            <label class="switch" for="newtab">
              <input type="checkbox" id="newtab" />
              <span class="track"><span class="thumb"></span></span>
              <span>在新标签页打开</span>
            </label>
            <button class="go" type="submit">
              前往作品
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12h13" /><path d="m12 5 7 7-7 7" />
              </svg>
            </button>
          </div>
        </form>

        <section class="history" id="history" hidden>
          <div class="hist-head">
            <h2>最近打开</h2>
            <button type="button" id="clearHist">清空</button>
          </div>
          <ul id="histList"></ul>
        </section>
      </div>

      <footer>
        按 <kbd>Enter</kbd> 直接打开 · 可粘贴完整作品链接自动识别 ID<br />
        浏览 Pixiv 需要账号登录，部分地区可能需网络代理
      </footer>
    </section>
  </main>

<script>
(function () {
  "use strict";

  var BASE = "https://www.pixiv.net/artworks/";
  var STORE = "pixiv-jump.history.v1";
  var STORE_NEWTAB = "pixiv-jump.newtab.v1";
  var MAX_HISTORY = 8;

  var form = document.getElementById("form");
  var field = document.getElementById("field");
  var input = document.getElementById("pid");
  var errEl = document.getElementById("err");
  var clearBtn = document.getElementById("clear");
  var newTab = document.getElementById("newtab");
  var historyEl = document.getElementById("history");
  var histList = document.getElementById("histList");
  var clearHist = document.getElementById("clearHist");

  function readHistory() {
    try {
      var raw = localStorage.getItem(STORE);
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.filter(function (id) { return /^\d+$/.test(id); }) : [];
    } catch (e) {
      return [];
    }
  }

  function writeHistory(list) {
    try { localStorage.setItem(STORE, JSON.stringify(list)); } catch (e) { /* 隐私模式忽略 */ }
  }

  function remember(id) {
    var list = readHistory().filter(function (x) { return x !== id; });
    list.unshift(id);
    writeHistory(list.slice(0, MAX_HISTORY));
    renderHistory();
  }

  function parseId(raw) {
    if (!raw) return "";
    var value = String(raw).trim();
    if (!value) return "";
    var byUrl = value.match(/artworks\/(\d{1,12})/i);
    if (byUrl) return byUrl[1];
    var byQuery = value.match(/[?&#]illust_id=(\d{1,12})/i);
    if (byQuery) return byQuery[1];
    var byDigits = value.match(/\d{1,12}/);
    return byDigits ? byDigits[0] : "";
  }

  function showError(message) {
    errEl.textContent = message;
    errEl.classList.add("show");
    field.classList.add("invalid", "shake");
    window.setTimeout(function () { field.classList.remove("shake"); }, 460);
    input.focus();
  }

  function clearError() {
    errEl.classList.remove("show");
    field.classList.remove("invalid");
  }

  function open(id) {
    var url = BASE + id;
    remember(id);
    if (newTab.checked) {
      var win = window.open(url, "_blank", "noopener");
      if (!win) window.location.href = url;
    } else {
      window.location.href = url;
    }
  }

  function renderHistory() {
    var list = readHistory();
    histList.textContent = "";
    if (!list.length) {
      historyEl.hidden = true;
      return;
    }
    historyEl.hidden = false;
    list.forEach(function (id) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.title = BASE + id;
      var hash = document.createElement("span");
      hash.className = "hash";
      hash.textContent = "#";
      btn.appendChild(hash);
      btn.appendChild(document.createTextNode(id));
      btn.addEventListener("click", function () { open(id); });
      li.appendChild(btn);
      histList.appendChild(li);
    });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    clearError();
    var id = parseId(input.value);
    if (!id) {
      showError("请输入作品 ID（纯数字，或直接粘贴作品链接）");
      return;
    }
    input.value = id;
    open(id);
  });

  input.addEventListener("input", function () {
    var value = input.value;
    var id = parseId(value);
    if (id && /[\/a-z?=]/i.test(value.trim())) input.value = id;
    clearBtn.hidden = !input.value;
    clearError();
  });

  input.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      input.value = "";
      clearBtn.hidden = true;
      clearError();
    }
  });

  clearBtn.addEventListener("click", function () {
    input.value = "";
    clearBtn.hidden = true;
    clearError();
    input.focus();
  });

  clearHist.addEventListener("click", function () {
    writeHistory([]);
    renderHistory();
    input.focus();
  });

  try {
    newTab.checked = localStorage.getItem(STORE_NEWTAB) === "1";
  } catch (e) { /* ignore */ }
  newTab.addEventListener("change", function () {
    try { localStorage.setItem(STORE_NEWTAB, newTab.checked ? "1" : "0"); } catch (e) { /* ignore */ }
  });

  renderHistory();
})();
</script>
</body>
</html>
