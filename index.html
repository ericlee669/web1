<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pixiv 作品直达 · PID 跳转</title>
<meta name="description" content="输入 Pixiv 作品 ID，一键跳转到 pixiv.net/artworks/ 作品页。" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#060a14" />
<link rel="preload" as="image" href="cover-desktop.webp" />
<style>
  :root {
    --sky: #5fb6f0;
    --sky-2: #8fd6ff;
    --ink: #f2f6ff;
    --muted: rgba(226, 236, 255, 0.62);
    --line: rgba(255, 255, 255, 0.14);
    --chip: rgba(255, 255, 255, 0.07);
    --danger: #ff8298;
    --card-a: 0.68;
    --card-ink: 8 12 22;
  }

  @media (max-width: 780px) {
    :root { --card-a: 0.34; }
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    align-items: center;
    justify-items: start;
    padding: clamp(18px, 5vw, 80px);
    background: #060a14;
    color: var(--ink);
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- card position (set from Settings) ---------- */
  body[data-h="left"]   { justify-items: start; }
  body[data-h="center"] { justify-items: center; }
  body[data-h="right"]  { justify-items: end; }
  body[data-v="top"]    { align-items: start; }
  body[data-v="middle"] { align-items: center; }
  body[data-v="bottom"] { align-items: end; }

  /* ---------- full-bleed artwork ---------- */
  .bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: #060a14; }
  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 38%;
    display: block;
  }
  .scrim {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(92deg, rgba(4, 7, 16, 0.80) 0%, rgba(4, 7, 16, 0.58) 30%, rgba(4, 7, 16, 0.14) 58%, rgba(4, 7, 16, 0.26) 100%),
      radial-gradient(80% 60% at 78% 22%, rgba(120, 170, 255, 0.16), transparent 70%);
  }

  /* ---------- glass card ---------- */
  .card {
    position: relative;
    width: min(452px, 100%);
    padding: clamp(22px, 2.6vw, 34px);
    border-radius: 24px;
    background: rgba(var(--card-ink), 0.68);
    background: linear-gradient(to top, rgb(var(--card-ink) / var(--card-a)), rgb(var(--card-ink) / calc(var(--card-a) * 0.72)));
    border: 1px solid rgba(255, 255, 255, 0.17);
    box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.10) inset;
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
    animation: rise 0.75s cubic-bezier(0.16, 0.84, 0.28, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.99); }
    to { opacity: 1; transform: none; }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.08);
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.86);
  }
  .badge i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--sky-2);
    box-shadow: 0 0 10px var(--sky-2);
  }

  h1 {
    margin: 13px 0 4px;
    font-size: clamp(22px, 2.4vw, 26px);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .sub {
    margin: 0 0 20px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  /* ---------- input ---------- */
  .field {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 60px;
    padding: 0 13px;
    border-radius: 15px;
    background: rgba(255, 255, 255, 0.07);
    border: 1.5px solid var(--line);
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    cursor: text;
  }
  .field:focus-within {
    border-color: var(--sky);
    background: rgba(255, 255, 255, 0.11);
    box-shadow: 0 0 0 4px rgba(95, 182, 240, 0.18);
  }
  .field.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(255, 130, 152, 0.14); }
  .field.shake { animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .prefix {
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: clamp(11.5px, 1.6vw, 13px);
    color: var(--muted);
    white-space: nowrap;
    user-select: none;
  }

  #pid {
    flex: 1;
    width: 100%;
    min-width: 0;
    height: 100%;
    padding: 0 4px 0 2px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: clamp(17px, 2.4vw, 21px);
    font-weight: 600;
    letter-spacing: 0.02em;
    outline: none;
  }
  #pid::placeholder { color: var(--muted); opacity: 0.65; font-weight: 500; }

  .clear {
    flex: none;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--chip);
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .clear[hidden] { display: none; }
  .clear:hover { color: var(--ink); transform: rotate(90deg); }

  .err {
    min-height: 17px;
    margin: 6px 2px 0;
    font-size: 12px;
    color: var(--danger);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .err.show { opacity: 1; transform: none; }

  /* ---------- actions ---------- */
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 2px;
  }

  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track {
    width: 36px; height: 21px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid var(--line);
    position: relative;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .thumb {
    position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.72);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.18s ease;
  }
  .switch input:checked + .track { background: rgba(95, 182, 240, 0.30); border-color: var(--sky); }
  .switch input:checked + .track .thumb { transform: translateX(15px); background: var(--sky-2); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 4px rgba(95, 182, 240, 0.22); }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(135deg, #3f9fe0, #7fd2ff 82%);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 16px 30px -16px rgba(63, 159, 224, 0.95);
    transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  }
  .go svg { transition: transform 0.18s ease; }
  .go:hover { transform: translateY(-1.5px); filter: brightness(1.05); box-shadow: 0 20px 36px -16px rgba(63, 159, 224, 1); }
  .go:hover svg { transform: translateX(3px); }
  .go:active { transform: translateY(0) scale(0.985); }
  .go:focus-visible { outline: 3px solid rgba(143, 214, 255, 0.6); outline-offset: 3px; }

  /* ---------- history ---------- */
  .history { margin-top: 20px; padding-top: 16px; border-top: 1px dashed rgba(255, 255, 255, 0.16); }
  .hist-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .hist-head h2 {
    margin: 0;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hist-head button {
    border: 0; background: none; padding: 2px 4px;
    color: var(--muted); font-family: inherit; font-size: 11px;
    cursor: pointer; border-radius: 6px;
    transition: color 0.15s ease;
  }
  .hist-head button:hover { color: var(--danger); }

  #histList { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 0; list-style: none; }
  #histList button {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: 11.5px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  #histList button:hover { border-color: var(--sky); background: rgba(95, 182, 240, 0.14); transform: translateY(-1px); }
  #histList .hash { color: var(--muted); }

  footer { margin-top: 18px; font-size: 11px; line-height: 1.7; color: rgba(226, 236, 255, 0.58); }
  footer kbd {
    font-family: inherit; font-size: 10px;
    padding: 1.5px 5px; border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
  }

  /* ---------- settings ---------- */
  .gear {
    position: fixed;
    top: max(14px, env(safe-area-inset-top));
    right: max(14px, env(safe-area-inset-right));
    z-index: 40;
    width: 42px;
    height: 42px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(10, 15, 28, 0.5);
    color: var(--ink);
    cursor: pointer;
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    box-shadow: 0 10px 24px -12px rgba(0, 0, 0, 0.8);
    transition: background 0.18s ease, transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1), border-color 0.18s ease;
  }
  .gear:hover { background: rgba(20, 30, 50, 0.7); border-color: rgba(255, 255, 255, 0.34); }
  .gear[aria-expanded="true"] { transform: rotate(90deg); border-color: var(--sky); }
  .gear:focus-visible { outline: 3px solid rgba(143, 214, 255, 0.55); outline-offset: 3px; }

  .settings {
    position: fixed;
    z-index: 45;
    top: max(66px, calc(env(safe-area-inset-top) + 60px));
    right: max(14px, env(safe-area-inset-right));
    width: min(310px, calc(100vw - 28px));
    padding: 18px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(9, 14, 26, 0.86);
    backdrop-filter: blur(26px) saturate(150%);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.95);
    color: var(--ink);
    animation: pop 0.22s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }
  .settings[hidden] { display: none; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-6px) scale(0.98); }
    to { opacity: 1; transform: none; }
  }

  .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .settings-head h2 { margin: 0; font-size: 13px; font-weight: 650; letter-spacing: 0.04em; }
  .x {
    width: 26px; height: 26px; display: grid; place-items: center;
    border: 0; border-radius: 8px; background: var(--chip); color: var(--muted);
    font-size: 15px; line-height: 1; cursor: pointer;
  }
  .x:hover { color: var(--ink); }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.07); }
  .row-label { font-size: 12px; color: var(--muted); flex: none; }

  .seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); }
  .seg button {
    border: 0; background: none; color: var(--muted);
    font-family: inherit; font-size: 11.5px;
    padding: 5px 10px; border-radius: 7px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .seg button:hover { color: var(--ink); }
  .seg button.on { background: rgba(95, 182, 240, 0.28); color: #fff; }

  .file-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 11px; border-radius: 9px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    background: rgba(255, 255, 255, 0.06);
    font-size: 11.5px; color: var(--ink); cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .file-btn:hover { border-color: var(--sky); background: rgba(95, 182, 240, 0.14); }
  .mini {
    border: 0; background: none; color: var(--muted); font-family: inherit;
    font-size: 11.5px; padding: 6px 8px; border-radius: 8px; cursor: pointer;
  }
  .mini:hover { color: var(--ink); background: var(--chip); }

  .alpha-wrap { display: inline-flex; align-items: center; gap: 8px; flex: 1; justify-content: flex-end; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 118px; height: 3px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.22);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--sky-2); border: 0; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border: 0; border-radius: 50%;
    background: var(--sky-2); cursor: pointer;
  }
  #alphaOut { font-size: 11px; color: var(--muted); width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

  .reset {
    width: 100%; margin-top: 14px; padding: 9px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.04);
    color: var(--muted); font-family: inherit; font-size: 11.5px; cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .reset:hover { color: var(--ink); border-color: rgba(255, 255, 255, 0.26); }

  .hint { margin: 10px 0 0; font-size: 10.5px; line-height: 1.6; color: rgba(226, 236, 255, 0.42); }

  /* ---------- phone ---------- */
  @media (max-width: 780px) {
    body {
      align-items: end;
      justify-items: center;
      padding: 0 max(12px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-bottom));
    }
    .bg img { object-position: 50% 26%; }
    .scrim {
      background:
        linear-gradient(to top, rgba(4, 7, 16, 0.82) 0%, rgba(4, 7, 16, 0.48) 34%, rgba(4, 7, 16, 0.05) 62%, rgba(4, 7, 16, 0.20) 100%);
    }
    .card {
      width: 100%;
      border-radius: 22px;
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
    }
    .actions { justify-content: stretch; }
    .go { flex: 1; justify-content: center; }
    .settings {
      top: auto;
      left: 12px;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      width: auto;
      border-radius: 20px;
    }
  }

  @media (max-width: 380px) {
    .prefix { font-size: 10.5px; letter-spacing: -0.02em; }
    .badge { letter-spacing: 0.12em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true"><img id="bgImg" src="cover-desktop.webp" alt="" fetchpriority="high" /></div>
  <div class="scrim" aria-hidden="true"></div>

  <button class="gear" id="settingsBtn" aria-label="外观设置" aria-expanded="false" aria-controls="settingsPanel">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="3.2" />
      <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z" />
    </svg>
  </button>

  <div class="settings" id="settingsPanel" role="dialog" aria-label="外观设置" hidden>
    <div class="settings-head">
      <h2>外观设置</h2>
      <button class="x" id="closeSettings" aria-label="关闭设置">×</button>
    </div>

    <div class="row">
      <span class="row-label">背景图片</span>
      <span style="display:inline-flex;align-items:center">
        <label class="file-btn" for="bgFile">选择…</label>
        <input type="file" id="bgFile" accept="image/*" hidden />
        <button class="mini" id="bgReset" type="button">默认</button>
      </span>
    </div>

    <div class="row">
      <span class="row-label">卡片左右</span>
      <div class="seg" id="segH" role="group" aria-label="卡片水平位置">
        <button type="button" data-val="left">左</button>
        <button type="button" data-val="center">中</button>
        <button type="button" data-val="right">右</button>
      </div>
    </div>

    <div class="row">
      <span class="row-label">卡片上下</span>
      <div class="seg" id="segV" role="group" aria-label="卡片垂直位置">
        <button type="button" data-val="top">上</button>
        <button type="button" data-val="middle">中</button>
        <button type="button" data-val="bottom">下</button>
      </div>
    </div>

    <div class="row">
      <span class="row-label">不透明度</span>
      <span class="alpha-wrap">
        <input type="range" id="alpha" min="0.1" max="0.95" step="0.05" value="0.34" aria-label="卡片不透明度" />
        <output id="alphaOut">34%</output>
      </span>
    </div>

    <button class="reset" id="resetAll" type="button">恢复全部默认</button>
    <p class="hint">设置只保存在本机浏览器，换设备需要重新设置。手机上「左右」不影响宽度。</p>
  </div>

  <main class="card">
    <span class="badge"><i></i>Pixiv Artwork</span>
    <h1>作品直达</h1>
    <p class="sub">输入作品 ID，一步抵达原作图页</p>

    <form id="form" novalidate>
      <label class="field" id="field" for="pid">
        <span class="prefix">pixiv.net/artworks/</span>
        <input id="pid" name="pid" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="123456789" aria-describedby="err" autofocus />
        <button class="clear" id="clear" type="button" hidden aria-label="清空输入">×</button>
      </label>
      <p class="err" id="err" role="alert" aria-live="polite"></p>

      <div class="actions">
        <label class="switch" for="newtab">
          <input type="checkbox" id="newtab" />
          <span class="track"><span class="thumb"></span></span>
          <span>在新标签页打开</span>
        </label>
        <button class="go" type="submit">
          前往作品
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13" /><path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </div>
    </form>

    <section class="history" id="history" hidden>
      <div class="hist-head">
        <h2>最近打开</h2>
        <button type="button" id="clearHist">清空</button>
      </div>
      <ul id="histList"></ul>
    </section>

    <footer>
      按 <kbd>Enter</kbd> 直接打开 · 可粘贴完整作品链接自动识别 ID<br />
      浏览 Pixiv 需要账号登录，部分地区可能需网络代理
    </footer>
  </main>

<script>
(function () {
  "use strict";

  /* ================= 作品跳转 ================= */
  var BASE = "https://www.pixiv.net/artworks/";
  var STORE = "pixiv-jump.history.v1";
  var STORE_NEWTAB = "pixiv-jump.newtab.v1";
  var MAX_HISTORY = 8;

  var form = document.getElementById("form");
  var field = document.getElementById("field");
  var input = document.getElementById("pid");
  var errEl = document.getElementById("err");
  var clearBtn = document.getElementById("clear");
  var newTab = document.getElementById("newtab");
  var historyEl = document.getElementById("history");
  var histList = document.getElementById("histList");
  var clearHist = document.getElementById("clearHist");

  function readHistory() {
    try {
      var raw = localStorage.getItem(STORE);
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.filter(function (id) { return /^\d+$/.test(id); }) : [];
    } catch (e) { return []; }
  }
  function writeHistory(list) {
    try { localStorage.setItem(STORE, JSON.stringify(list)); } catch (e) {}
  }
  function remember(id) {
    var list = readHistory().filter(function (x) { return x !== id; });
    list.unshift(id);
    writeHistory(list.slice(0, MAX_HISTORY));
    renderHistory();
  }
  function parseId(raw) {
    if (!raw) return "";
    var value = String(raw).trim();
    if (!value) return "";
    var byUrl = value.match(/artworks\/(\d{1,12})/i);
    if (byUrl) return byUrl[1];
    var byQuery = value.match(/[?&#]illust_id=(\d{1,12})/i);
    if (byQuery) return byQuery[1];
    var byDigits = value.match(/\d{1,12}/);
    return byDigits ? byDigits[0] : "";
  }
  function showError(message) {
    errEl.textContent = message;
    errEl.classList.add("show");
    field.classList.add("invalid", "shake");
    window.setTimeout(function () { field.classList.remove("shake"); }, 460);
    input.focus();
  }
  function clearError() {
    errEl.classList.remove("show");
    field.classList.remove("invalid");
  }
  function open(id) {
    var url = BASE + id;
    remember(id);
    if (newTab.checked) {
      var win = window.open(url, "_blank", "noopener");
      if (!win) window.location.href = url;
    } else {
      window.location.href = url;
    }
  }
  function renderHistory() {
    var list = readHistory();
    histList.textContent = "";
    if (!list.length) { historyEl.hidden = true; return; }
    historyEl.hidden = false;
    list.forEach(function (id) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.title = BASE + id;
      var hash = document.createElement("span");
      hash.className = "hash";
      hash.textContent = "#";
      btn.appendChild(hash);
      btn.appendChild(document.createTextNode(id));
      btn.addEventListener("click", function () { open(id); });
      li.appendChild(btn);
      histList.appendChild(li);
    });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    clearError();
    var id = parseId(input.value);
    if (!id) { showError("请输入作品 ID（纯数字，或直接粘贴作品链接）"); return; }
    input.value = id;
    open(id);
  });
  input.addEventListener("input", function () {
    var value = input.value;
    var id = parseId(value);
    if (id && /[\/a-z?=]/i.test(value.trim())) input.value = id;
    clearBtn.hidden = !input.value;
    clearError();
  });
  input.addEventListener("keydown", function (event) {
    if (event.key === "Escape") { input.value = ""; clearBtn.hidden = true; clearError(); }
  });
  clearBtn.addEventListener("click", function () {
    input.value = ""; clearBtn.hidden = true; clearError(); input.focus();
  });
  clearHist.addEventListener("click", function () {
    writeHistory([]); renderHistory(); input.focus();
  });
  try { newTab.checked = localStorage.getItem(STORE_NEWTAB) === "1"; } catch (e) {}
  newTab.addEventListener("change", function () {
    try { localStorage.setItem(STORE_NEWTAB, newTab.checked ? "1" : "0"); } catch (e) {}
  });
  renderHistory();

  /* ================= 外观设置 ================= */
  var PREF_KEY = "pixiv-jump.prefs.v1";
  var DEFAULT_DESKTOP = "cover-desktop.webp";
  var DEFAULT_MOBILE = "cover-mobile.webp";
  var bgImg = document.getElementById("bgImg");
  var mq = window.matchMedia("(max-width: 780px)");

  var prefs = { h: null, v: null, alpha: null };
  try {
    var saved = JSON.parse(localStorage.getItem(PREF_KEY) || "null");
    if (saved && typeof saved === "object") prefs = { h: saved.h || null, v: saved.v || null, alpha: typeof saved.alpha === "number" ? saved.alpha : null };
  } catch (e) {}

  var customBg = null;

  function savePrefs() {
    try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) {}
  }

  /* --- tiny IndexedDB store for the custom image (localStorage is too small) --- */
  function idb(mode, handler) {
    return new Promise(function (resolve, reject) {
      if (!("indexedDB" in window)) { reject(new Error("no idb")); return; }
      var req = indexedDB.open("pixiv-jump", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("kv"); };
      req.onerror = function () { reject(req.error); };
      req.onsuccess = function () {
        var db = req.result;
        try {
          var tx = db.transaction("kv", mode);
          var store = tx.objectStore("kv");
          var r = handler(store);
          tx.oncomplete = function () { db.close(); resolve(r && r.result); };
          tx.onerror = function () { db.close(); reject(tx.error); };
        } catch (e) { db.close(); reject(e); }
      };
    });
  }
  function bgSave(data) { return idb("readwrite", function (s) { return s.put(data, "bg"); }); }
  function bgLoad() { return idb("readonly", function (s) { return s.get("bg"); }); }
  function bgClear() { return idb("readwrite", function (s) { return s.delete("bg"); }); }

  function applyBg() {
    bgImg.src = customBg || (mq.matches ? DEFAULT_MOBILE : DEFAULT_DESKTOP);
  }
  if (mq.addEventListener) mq.addEventListener("change", applyBg);
  else if (mq.addListener) mq.addListener(applyBg);

  function applyPosition() {
    if (prefs.h) document.body.setAttribute("data-h", prefs.h);
    else document.body.removeAttribute("data-h");
    if (prefs.v) document.body.setAttribute("data-v", prefs.v);
    else document.body.removeAttribute("data-v");
    markSeg("segH", prefs.h);
    markSeg("segV", prefs.v);
  }
  function markSeg(id, val) {
    var seg = document.getElementById(id);
    Array.prototype.forEach.call(seg.querySelectorAll("button"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-val") === val);
    });
  }

  var alphaInput = document.getElementById("alpha");
  var alphaOut = document.getElementById("alphaOut");
  function currentAlpha() {
    if (prefs.alpha != null) return prefs.alpha;
    return mq.matches ? 0.34 : 0.68;
  }
  function applyAlpha() {
    var a = currentAlpha();
    document.documentElement.style.setProperty("--card-a", String(a));
    alphaInput.value = String(a);
    alphaOut.textContent = Math.round(a * 100) + "%";
  }

  document.getElementById("segH").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-val]");
    if (!b) return;
    var val = b.getAttribute("data-val");
    prefs.h = prefs.h === val ? null : val;
    savePrefs(); applyPosition();
  });
  document.getElementById("segV").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-val]");
    if (!b) return;
    var val = b.getAttribute("data-val");
    prefs.v = prefs.v === val ? null : val;
    savePrefs(); applyPosition();
  });

  alphaInput.addEventListener("input", function () {
    prefs.alpha = Number(alphaInput.value);
    applyAlpha();
    savePrefs();
  });

  /* --- custom background image --- */
  function downscale(file, cb) {
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1800;
      var scale = Math.min(1, max / Math.max(img.width, img.height));
      var w = Math.max(1, Math.round(img.width * scale));
      var h = Math.max(1, Math.round(img.height * scale));
      var canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      try { cb(canvas.toDataURL("image/jpeg", 0.86)); } catch (e) { cb(null); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  document.getElementById("bgFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    downscale(file, function (dataUrl) {
      if (!dataUrl) return;
      customBg = dataUrl;
      applyBg();
      bgSave(dataUrl).catch(function () { /* 存不下就只在本次有效 */ });
    });
    e.target.value = "";
  });

  document.getElementById("bgReset").addEventListener("click", function () {
    customBg = null;
    applyBg();
    bgClear().catch(function () {});
  });

  document.getElementById("resetAll").addEventListener("click", function () {
    prefs = { h: null, v: null, alpha: null };
    savePrefs();
    customBg = null;
    bgClear().catch(function () {});
    applyBg();
    applyPosition();
    applyAlpha();
  });

  /* --- panel open/close --- */
  var gearBtn = document.getElementById("settingsBtn");
  var panel = document.getElementById("settingsPanel");
  function setOpen(open) {
    panel.hidden = !open;
    gearBtn.setAttribute("aria-expanded", open ? "true" : "false");
  }
  gearBtn.addEventListener("click", function () { setOpen(panel.hidden); });
  document.getElementById("closeSettings").addEventListener("click", function () { setOpen(false); gearBtn.focus(); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panel.hidden) { setOpen(false); gearBtn.focus(); }
  });
  document.addEventListener("pointerdown", function (e) {
    if (panel.hidden) return;
    if (panel.contains(e.target) || gearBtn.contains(e.target)) return;
    setOpen(false);
  });

  /* --- boot --- */
  applyPosition();
  applyAlpha();
  applyBg();
  bgLoad().then(function (data) {
    if (data) { customBg = data; applyBg(); }
  }).catch(function () {});
})();
</script>
</body>
</html>
