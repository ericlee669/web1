<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pixiv 作品直达 · PID 跳转</title>
<meta name="description" content="输入 Pixiv 作品 ID，一键跳转到 pixiv.net/artworks/ 作品页。" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#060a14" />
<link rel="preload" as="image" href="cover-desktop.webp" media="(min-width: 781px)" />
<link rel="preload" as="image" href="cover-mobile.webp" media="(max-width: 780px)" />
<style>
  :root {
    --sky: #5fb6f0;
    --sky-2: #8fd6ff;
    --pink: #ff7fa4;
    --ink: #f2f6ff;
    --muted: rgba(226, 236, 255, 0.62);
    --line: rgba(255, 255, 255, 0.14);
    --card: rgba(10, 15, 28, 0.68);
    --field: rgba(255, 255, 255, 0.07);
    --chip: rgba(255, 255, 255, 0.07);
    --danger: #ff8298;
  }

  * { box-sizing: border-box; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    align-items: center;
    justify-items: start;
    padding: clamp(18px, 5vw, 80px);
    background: #060a14;
    color: var(--ink);
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- full-bleed artwork ---------- */
  .bg { position: fixed; inset: 0; z-index: -2; overflow: hidden; background: #060a14; }
  .bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 38%;
    display: block;
  }
  .scrim {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      linear-gradient(92deg, rgba(4, 7, 16, 0.80) 0%, rgba(4, 7, 16, 0.58) 30%, rgba(4, 7, 16, 0.14) 58%, rgba(4, 7, 16, 0.26) 100%),
      radial-gradient(80% 60% at 78% 22%, rgba(120, 170, 255, 0.16), transparent 70%);
  }

  /* ---------- glass card ---------- */
  .card {
    position: relative;
    width: min(452px, 100%);
    padding: clamp(22px, 2.6vw, 34px);
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: 0 40px 80px -40px rgba(0, 0, 0, 0.9), 0 1px 0 rgba(255, 255, 255, 0.10) inset;
    backdrop-filter: blur(22px) saturate(135%);
    -webkit-backdrop-filter: blur(22px) saturate(135%);
    animation: rise 0.75s cubic-bezier(0.16, 0.84, 0.28, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(18px) scale(0.99); }
    to { opacity: 1; transform: none; }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    background: rgba(255, 255, 255, 0.08);
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.86);
  }
  .badge i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--sky-2);
    box-shadow: 0 0 10px var(--sky-2);
  }

  h1 {
    margin: 13px 0 4px;
    font-size: clamp(22px, 2.4vw, 26px);
    line-height: 1.25;
    letter-spacing: -0.01em;
  }
  .sub {
    margin: 0 0 20px;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
  }

  /* ---------- input ---------- */
  .field {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 60px;
    padding: 0 13px;
    border-radius: 15px;
    background: var(--field);
    border: 1.5px solid var(--line);
    transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    cursor: text;
  }
  .field:focus-within {
    border-color: var(--sky);
    background: rgba(255, 255, 255, 0.11);
    box-shadow: 0 0 0 4px rgba(95, 182, 240, 0.18);
  }
  .field.invalid { border-color: var(--danger); box-shadow: 0 0 0 4px rgba(255, 130, 152, 0.14); }
  .field.shake { animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  .prefix {
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: clamp(11.5px, 1.6vw, 13px);
    color: var(--muted);
    white-space: nowrap;
    user-select: none;
  }

  #pid {
    flex: 1;
    min-width: 0;
    height: 100%;
    padding: 0 4px 0 2px;
    border: 0;
    background: transparent;
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: clamp(17px, 2.4vw, 21px);
    font-weight: 600;
    letter-spacing: 0.02em;
    outline: none;
  }
  #pid::placeholder { color: var(--muted); opacity: 0.65; font-weight: 500; }

  .clear {
    flex: none;
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border: 0;
    border-radius: 50%;
    background: var(--chip);
    color: var(--muted);
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
  }
  .clear[hidden] { display: none; }
  .clear:hover { color: var(--ink); transform: rotate(90deg); }

  .err {
    min-height: 17px;
    margin: 6px 2px 0;
    font-size: 12px;
    color: var(--danger);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.16s ease, transform 0.16s ease;
  }
  .err.show { opacity: 1; transform: none; }

  /* ---------- actions ---------- */
  .actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 2px;
  }

  .switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
  .track {
    width: 36px; height: 21px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.10);
    border: 1px solid var(--line);
    position: relative;
    transition: background 0.18s ease, border-color 0.18s ease;
  }
  .thumb {
    position: absolute; top: 2px; left: 2px;
    width: 15px; height: 15px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.72);
    transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.18s ease;
  }
  .switch input:checked + .track { background: rgba(95, 182, 240, 0.30); border-color: var(--sky); }
  .switch input:checked + .track .thumb { transform: translateX(15px); background: var(--sky-2); }
  .switch input:focus-visible + .track { box-shadow: 0 0 0 4px rgba(95, 182, 240, 0.22); }

  .go {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 22px;
    border: 0;
    border-radius: 13px;
    background: linear-gradient(135deg, #3f9fe0, #7fd2ff 82%);
    color: #fff;
    font-family: inherit;
    font-size: 14px;
    font-weight: 650;
    cursor: pointer;
    box-shadow: 0 16px 30px -16px rgba(63, 159, 224, 0.95);
    transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
  }
  .go svg { transition: transform 0.18s ease; }
  .go:hover { transform: translateY(-1.5px); filter: brightness(1.05); box-shadow: 0 20px 36px -16px rgba(63, 159, 224, 1); }
  .go:hover svg { transform: translateX(3px); }
  .go:active { transform: translateY(0) scale(0.985); }
  .go:focus-visible { outline: 3px solid rgba(143, 214, 255, 0.6); outline-offset: 3px; }

  /* ---------- history ---------- */
  .history { margin-top: 20px; padding-top: 16px; border-top: 1px dashed rgba(255, 255, 255, 0.16); }
  .hist-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
  .hist-head h2 {
    margin: 0;
    font-size: 10px;
    font-weight: 650;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .hist-head button {
    border: 0; background: none; padding: 2px 4px;
    color: var(--muted); font-family: inherit; font-size: 11px;
    cursor: pointer; border-radius: 6px;
    transition: color 0.15s ease;
  }
  .hist-head button:hover { color: var(--danger); }

  #histList { display: flex; flex-wrap: wrap; gap: 7px; margin: 0; padding: 0; list-style: none; }
  #histList button {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: 11.5px;
    cursor: pointer;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  #histList button:hover { border-color: var(--sky); background: rgba(95, 182, 240, 0.14); transform: translateY(-1px); }
  #histList .hash { color: var(--muted); }

  footer { margin-top: 18px; font-size: 11px; line-height: 1.7; color: rgba(226, 236, 255, 0.58); }
  footer kbd {
    font-family: inherit; font-size: 10px;
    padding: 1.5px 5px; border-radius: 5px;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--ink);
  }

  /* ---------- phone: artwork as the page background, card sits on top of it ---------- */
  @media (max-width: 780px) {
    body {
      align-items: end;
      justify-items: center;
      padding: 0 max(12px, env(safe-area-inset-left)) max(14px, env(safe-area-inset-bottom));
    }
    .bg img { object-position: 50% 26%; }
    .scrim {
      background:
        linear-gradient(to top, rgba(4, 7, 16, 0.82) 0%, rgba(4, 7, 16, 0.48) 34%, rgba(4, 7, 16, 0.05) 62%, rgba(4, 7, 16, 0.20) 100%);
    }
    .card {
      width: 100%;
      border-radius: 22px;
      background: linear-gradient(to top, rgba(8, 12, 22, 0.34), rgba(8, 12, 22, 0.24));
      border-color: rgba(255, 255, 255, 0.20);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      box-shadow: 0 26px 60px -30px rgba(0, 0, 0, 0.85), 0 1px 0 rgba(255, 255, 255, 0.14) inset;
    }
    .actions { justify-content: stretch; }
    .go { flex: 1; justify-content: center; }
  }

  @media (max-width: 380px) {
    .prefix { font-size: 10.5px; letter-spacing: -0.02em; }
    .badge { letter-spacing: 0.12em; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <picture>
      <source media="(max-width: 780px)" srcset="cover-mobile.webp" />
      <img src="cover-desktop.webp" alt="" fetchpriority="high" />
    </picture>
  </div>
  <div class="scrim" aria-hidden="true"></div>

  <main class="card">
    <span class="badge"><i></i>Pixiv Artwork</span>
    <h1>作品直达</h1>
    <p class="sub">输入作品 ID，一步抵达原作图页</p>

    <form id="form" novalidate>
      <label class="field" id="field" for="pid">
        <span class="prefix">pixiv.net/artworks/</span>
        <input id="pid" name="pid" type="text" inputmode="numeric" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="123456789" aria-describedby="err" autofocus />
        <button class="clear" id="clear" type="button" hidden aria-label="清空输入">×</button>
      </label>
      <p class="err" id="err" role="alert" aria-live="polite"></p>

      <div class="actions">
        <label class="switch" for="newtab">
          <input type="checkbox" id="newtab" />
          <span class="track"><span class="thumb"></span></span>
          <span>在新标签页打开</span>
        </label>
        <button class="go" type="submit">
          前往作品
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13" /><path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </div>
    </form>

    <section class="history" id="history" hidden>
      <div class="hist-head">
        <h2>最近打开</h2>
        <button type="button" id="clearHist">清空</button>
      </div>
      <ul id="histList"></ul>
    </section>

    <footer>
      按 <kbd>Enter</kbd> 直接打开 · 可粘贴完整作品链接自动识别 ID<br />
      浏览 Pixiv 需要账号登录，部分地区可能需网络代理
    </footer>
  </main>

<script>
(function () {
  "use strict";

  var BASE = "https://www.pixiv.net/artworks/";
  var STORE = "pixiv-jump.history.v1";
  var STORE_NEWTAB = "pixiv-jump.newtab.v1";
  var MAX_HISTORY = 8;

  var form = document.getElementById("form");
  var field = document.getElementById("field");
  var input = document.getElementById("pid");
  var errEl = document.getElementById("err");
  var clearBtn = document.getElementById("clear");
  var newTab = document.getElementById("newtab");
  var historyEl = document.getElementById("history");
  var histList = document.getElementById("histList");
  var clearHist = document.getElementById("clearHist");

  function readHistory() {
    try {
      var raw = localStorage.getItem(STORE);
      var list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list.filter(function (id) { return /^\d+$/.test(id); }) : [];
    } catch (e) {
      return [];
    }
  }

  function writeHistory(list) {
    try { localStorage.setItem(STORE, JSON.stringify(list)); } catch (e) { /* 隐私模式忽略 */ }
  }

  function remember(id) {
    var list = readHistory().filter(function (x) { return x !== id; });
    list.unshift(id);
    writeHistory(list.slice(0, MAX_HISTORY));
    renderHistory();
  }

  function parseId(raw) {
    if (!raw) return "";
    var value = String(raw).trim();
    if (!value) return "";
    var byUrl = value.match(/artworks\/(\d{1,12})/i);
    if (byUrl) return byUrl[1];
    var byQuery = value.match(/[?&#]illust_id=(\d{1,12})/i);
    if (byQuery) return byQuery[1];
    var byDigits = value.match(/\d{1,12}/);
    return byDigits ? byDigits[0] : "";
  }

  function showError(message) {
    errEl.textContent = message;
    errEl.classList.add("show");
    field.classList.add("invalid", "shake");
    window.setTimeout(function () { field.classList.remove("shake"); }, 460);
    input.focus();
  }

  function clearError() {
    errEl.classList.remove("show");
    field.classList.remove("invalid");
  }

  function open(id) {
    var url = BASE + id;
    remember(id);
    if (newTab.checked) {
      var win = window.open(url, "_blank", "noopener");
      if (!win) window.location.href = url;
    } else {
      window.location.href = url;
    }
  }

  function renderHistory() {
    var list = readHistory();
    histList.textContent = "";
    if (!list.length) {
      historyEl.hidden = true;
      return;
    }
    historyEl.hidden = false;
    list.forEach(function (id) {
      var li = document.createElement("li");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.title = BASE + id;
      var hash = document.createElement("span");
      hash.className = "hash";
      hash.textContent = "#";
      btn.appendChild(hash);
      btn.appendChild(document.createTextNode(id));
      btn.addEventListener("click", function () { open(id); });
      li.appendChild(btn);
      histList.appendChild(li);
    });
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    clearError();
    var id = parseId(input.value);
    if (!id) {
      showError("请输入作品 ID（纯数字，或直接粘贴作品链接）");
      return;
    }
    input.value = id;
    open(id);
  });

  input.addEventListener("input", function () {
    var value = input.value;
    var id = parseId(value);
    if (id && /[\/a-z?=]/i.test(value.trim())) input.value = id;
    clearBtn.hidden = !input.value;
    clearError();
  });

  input.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      input.value = "";
      clearBtn.hidden = true;
      clearError();
    }
  });

  clearBtn.addEventListener("click", function () {
    input.value = "";
    clearBtn.hidden = true;
    clearError();
    input.focus();
  });

  clearHist.addEventListener("click", function () {
    writeHistory([]);
    renderHistory();
    input.focus();
  });

  try {
    newTab.checked = localStorage.getItem(STORE_NEWTAB) === "1";
  } catch (e) { /* ignore */ }
  newTab.addEventListener("change", function () {
    try { localStorage.setItem(STORE_NEWTAB, newTab.checked ? "1" : "0"); } catch (e) { /* ignore */ }
  });

  renderHistory();
})();
</script>
</body>
</html>
