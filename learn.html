<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>单词学习 · 阅读/完形高频词</title>
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0a1020" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="单词学习" />

<style>
  :root {
    --sky: #5fb6f0;
    --sky-2: #8fd6ff;
    --ink: #eef4ff;
    --muted: rgba(228, 238, 255, 0.58);
    --line: rgba(255, 255, 255, 0.12);
    --panel: rgba(14, 21, 38, 0.66);
    --chip: rgba(255, 255, 255, 0.06);
    --good: #46d59b;
    --warn: #ff9d5c;
    --danger: #ff7d95;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background:
      radial-gradient(60% 45% at 15% 0%, rgba(70, 140, 220, 0.26), transparent 70%),
      radial-gradient(55% 40% at 95% 10%, rgba(160, 90, 200, 0.20), transparent 70%),
      #080d18;
    color: var(--ink);
    font-family: "Inter", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    padding-bottom: 60px;
  }

  .wrap { width: min(880px, 100%); margin: 0 auto; padding: 16px 14px 0; }

  header.top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 4px 0 12px; }
  .back {
    display: inline-flex; align-items: center; gap: 5px; color: var(--muted);
    text-decoration: none; font-size: 12px; padding: 5px 9px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--chip);
  }
  .back:hover { color: var(--ink); border-color: var(--sky); }
  h1 { margin: 0; font-size: 17px; letter-spacing: -0.01em; }
  .stat { margin-left: auto; display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); }
  .stat b { color: var(--ink); font-weight: 650; }

  .toolbar { display: flex; gap: 7px; flex-wrap: wrap; padding: 2px 0 12px; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px; border-radius: 9px; cursor: pointer;
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    font-family: inherit; font-size: 12px; white-space: nowrap;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .btn:hover { border-color: var(--sky); background: rgba(95, 182, 240, 0.13); }
  .btn.on { border-color: var(--sky); background: rgba(95, 182, 240, 0.2); color: #fff; }

  .search {
    display: flex; align-items: center; gap: 6px; flex: 1; min-width: 150px;
    border: 1px solid var(--line); background: var(--chip); border-radius: 9px; padding: 0 10px;
  }
  .search input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    color: var(--ink); font-family: inherit; font-size: 12.5px; padding: 7px 0;
  }
  .search input::placeholder { color: var(--muted); }

  .tabs { display: flex; gap: 5px; padding: 3px; border-radius: 11px; background: var(--chip); border: 1px solid var(--line); width: fit-content; margin-bottom: 12px; }
  .tabs button { border: 0; background: none; color: var(--muted); font-family: inherit; font-size: 12px; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .tabs button.on { background: rgba(95, 182, 240, 0.24); color: #fff; }

  /* ---------- list rows ---------- */
  .list { display: flex; flex-direction: column; gap: 7px; }
  .item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 4px 12px;
    align-items: center;
    padding: 11px 13px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    animation: fadeIn .18s ease both;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
  .item.out { opacity: 0; transform: translateX(10px); transition: opacity .18s ease, transform .18s ease; }

  .wline { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
  .w { font-size: 16.5px; font-weight: 650; letter-spacing: -0.01em; word-break: break-word; }
  .freq {
    flex: none; font-size: 10.5px; color: var(--sky-2);
    padding: 1px 6px; border-radius: 999px;
    background: rgba(95, 182, 240, 0.14); border: 1px solid rgba(95, 182, 240, 0.28);
    font-variant-numeric: tabular-nums;
  }
  .sub { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
  .phon { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--muted); }
  .meaning { font-size: 12.5px; line-height: 1.65; color: #d8e5ff; margin-top: 3px; }
  .meaning.dim { color: var(--muted); font-style: italic; }

  .ops { display: flex; gap: 6px; flex: none; }
  .op {
    border: 1px solid var(--line); background: var(--chip); color: var(--ink);
    font-family: inherit; font-size: 11.5px; padding: 6px 10px; border-radius: 8px;
    cursor: pointer; white-space: nowrap;
    transition: border-color .15s ease, background .15s ease, color .15s ease;
  }
  .op:hover { border-color: var(--sky); background: rgba(95, 182, 240, 0.14); }
  .op.on { border-color: var(--sky); background: rgba(95, 182, 240, 0.2); }
  .op.new { border-color: rgba(255, 157, 92, 0.42); background: rgba(255, 157, 92, 0.12); color: #ffd9b8; }
  .op.new:hover { border-color: var(--warn); background: rgba(255, 157, 92, 0.2); }
  .op.known { border-color: rgba(70, 213, 155, 0.42); background: rgba(70, 213, 155, 0.12); color: #bff5df; }
  .op.known:hover { border-color: var(--good); background: rgba(70, 213, 155, 0.2); }
  .op.gray { color: var(--muted); }

  .empty { text-align: center; color: var(--muted); font-size: 13px; padding: 50px 0; }
  .more { display: flex; justify-content: center; padding: 16px 0 8px; }
  .count { font-size: 11.5px; color: var(--muted); padding: 8px 2px 4px; }

  /* ---------- sync sheet ---------- */
  .sheet { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(4, 8, 16, .66); backdrop-filter: blur(6px); padding: 16px; }
  .sheet-box { width: min(460px, 100%); background: #0e1526; border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: 0 30px 70px -30px #000; }
  .sheet-box h2 { margin: 0 0 6px; font-size: 15px; }
  .sheet-box p { margin: 0 0 14px; font-size: 12px; line-height: 1.7; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
  .field label { font-size: 11.5px; color: var(--muted); }
  .field input { background: rgba(255,255,255,.06); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; color: var(--ink); font-family: ui-monospace, Consolas, monospace; font-size: 12px; outline: none; }
  .field input:focus { border-color: var(--sky); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 12px; }
  .sheet-actions .btn { flex: 1; justify-content: center; }
  .status { font-size: 11.5px; color: var(--muted); margin-top: 10px; min-height: 16px; }
  .status.ok { color: var(--good); }
  .status.err { color: var(--danger); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(8px);
    background: rgba(20, 30, 50, .96); border: 1px solid var(--line);
    padding: 8px 15px; border-radius: 10px; font-size: 12px; opacity: 0;
    transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 80;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 620px) {
    .item { grid-template-columns: 1fr; }
    .ops { margin-top: 8px; }
    .ops .op { flex: 1; justify-content: center; text-align: center; padding: 8px 6px; }
    .stat { width: 100%; margin-left: 0; justify-content: space-between; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: .001ms !important; animation-duration: .001ms !important; }
  }

  /* pwa-safe-area */
  html { background: #080d18; }
  body {
    padding-top: max(10px, env(safe-area-inset-top));
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
    background-color: #080d18;
  }
  </style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="index.html">← 返回</a>
    <h1>单词学习</h1>
    <div class="stat">
      <span>待学 <b id="sLeft">–</b></span>
      <span>生词 <b id="sNew">–</b></span>
      <span>熟词 <b id="sKnown">–</b></span>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <span style="color:var(--muted);font-size:13px">⌕</span>
      <input id="q" placeholder="搜索单词或释义…" autocomplete="off" spellcheck="false" />
    </div>
    <button class="btn on" data-sort="freq">按频次</button>
    <button class="btn" data-sort="az">按字母</button>
    <button class="btn" data-sort="rand">随机</button>
    <button class="btn" id="btnSync">云同步</button>
    <button class="btn" id="btnExport">导出</button>
    <button class="btn" id="btnImport">导入</button>
    <input type="file" id="fileImport" accept="application/json" hidden />
  </div>

  <div class="tabs" id="tabs">
    <button data-tab="study" class="on">学习</button>
    <button data-tab="new">生词本</button>
    <button data-tab="known">熟词本</button>
  </div>

  <div class="count" id="count"></div>
  <div class="list" id="list"></div>
  <div class="more" id="more" hidden></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-box">
    <h2>跨设备同步</h2>
    <p>用你自己的 GitHub 仓库存进度：填一个<strong>只对该仓库有 Contents 读写权限</strong>的 Token，数据写进仓库里的 <code>wordbook.json</code>。手机和电脑填同一个仓库即可共用进度。Token 只保存在本机浏览器。</p>
    <div class="field">
      <label>仓库（owner/repo）</label>
      <input id="syncRepo" placeholder="ericlee669/web1" autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>文件路径</label>
      <input id="syncPath" placeholder="wordbook.json" autocomplete="off" spellcheck="false" />
    </div>
    <div class="field">
      <label>Token</label>
      <input id="syncToken" type="password" placeholder="github_pat_… 或 ghp_…" autocomplete="off" spellcheck="false" />
    </div>
    <div class="sheet-actions">
      <button class="btn" id="btnSyncClose">关闭</button>
      <button class="btn on" id="btnSyncNow">立即同步</button>
    </div>
    <div class="status" id="syncStatus"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="words.js"></script>
<script>
(function () {
  "use strict";

  var WORDS = (window.WORDS || []).slice();
  var KEY_STATE = "wordlearner.state.v1";
  var KEY_CFG = "wordlearner.sync.v1";
  var PAGE = 80;

  /* ---------- state ---------- */
  var state = { v: 1, updatedAt: 0, marks: {} };
  function wordKey(w) { return String(w).toLowerCase().replace(/\s+/g, " ").trim(); }
  function loadState() {
    try {
      var raw = localStorage.getItem(KEY_STATE);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && p.marks) state = { v: 1, updatedAt: p.updatedAt || 0, marks: p.marks };
      }
    } catch (e) {}
  }
  var saveTimer = null;
  function saveState(immediate) {
    state.updatedAt = Date.now();
    clearTimeout(saveTimer);
    var write = function () {
      try { localStorage.setItem(KEY_STATE, JSON.stringify(state)); } catch (e) {}
      schedulePush();
    };
    if (immediate) write(); else saveTimer = setTimeout(write, 350);
  }
  function markOf(w) { return state.marks[wordKey(w)]; }
  function setMark(w, s) { state.marks[wordKey(w)] = { s: s, t: Date.now() }; saveState(true); }
  function clearMark(w) { delete state.marks[wordKey(w)]; saveState(true); }

  function stats() {
    var n = 0, k = 0;
    for (var i = 0; i < WORDS.length; i++) {
      var m = markOf(WORDS[i].w); if (!m) continue;
      if (m.s === "known") k++; else n++;
    }
    return { total: WORDS.length, known: k, neww: n, left: WORDS.length - k - n };
  }
  function renderStats() {
    var s = stats();
    $("sLeft").textContent = s.left;
    $("sNew").textContent = s.neww;
    $("sKnown").textContent = s.known;
  }

  /* ---------- view state ---------- */
  var tab = "study";
  var sortMode = "freq";
  var query = "";
  var revealed = {};      // key -> true (session only)
  var shown = 0;
  var currentRows = [];

  function $ (id) { return document.getElementById(id); }

  function matches(x) {
    if (!query) return true;
    var q = query.toLowerCase();
    return x.w.toLowerCase().indexOf(q) >= 0 || (x.m || "").toLowerCase().indexOf(q) >= 0;
  }

  function buildRows() {
    var arr;
    if (tab === "study") {
      arr = WORDS.filter(function (x) { return !markOf(x.w) && matches(x); });
    } else {
      arr = WORDS.filter(function (x) {
        var m = markOf(x.w);
        return m && m.s === tab && matches(x);
      });
    }
    if (sortMode === "freq") arr.sort(function (a, b) { return (b.f || 0) - (a.f || 0); });
    else if (sortMode === "az") arr.sort(function (a, b) { return a.w.toLowerCase() < b.w.toLowerCase() ? -1 : 1; });
    else if (sortMode === "rand") {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
    }
    return arr;
  }

  function makeItem(x, forBook) {
    var item = document.createElement("div");
    item.className = "item";

    var left = document.createElement("div");
    var wline = document.createElement("div");
    wline.className = "wline";
    var w = document.createElement("span");
    w.className = "w";
    w.textContent = x.w;
    wline.appendChild(w);
    if (x.f) {
      var f = document.createElement("span");
      f.className = "freq";
      f.textContent = "×" + x.f;
      f.title = "词频 " + x.f + "（来自原 PDF）";
      wline.appendChild(f);
    }
    left.appendChild(wline);

    var sub = document.createElement("div");
    sub.className = "sub";
    if (x.p) {
      var ph = document.createElement("span");
      ph.className = "phon";
      ph.textContent = x.p;
      sub.appendChild(ph);
    }
    left.appendChild(sub);

    var meaning = document.createElement("div");
    meaning.className = "meaning";
    var key = wordKey(x.w);
    if (revealed[key]) {
      meaning.textContent = x.m;
    } else {
      meaning.textContent = x.m;
      meaning.hidden = true;
    }
    left.appendChild(meaning);

    var ops = document.createElement("div");
    ops.className = "ops";

    var bShow = document.createElement("button");
    bShow.className = "op";
    bShow.textContent = revealed[key] ? "隐藏意思" : "显示意思";
    bShow.addEventListener("click", function () {
      if (revealed[key]) { delete revealed[key]; meaning.hidden = true; bShow.textContent = "显示意思"; }
      else { revealed[key] = true; meaning.hidden = false; bShow.textContent = "隐藏意思"; }
    });
    ops.appendChild(bShow);

    if (!forBook) {
      var bNew = document.createElement("button");
      bNew.className = "op new";
      bNew.textContent = "生词";
      bNew.addEventListener("click", function () {
        setMark(x.w, "new");
        removeRow(item);
        toast("已加入生词本");
      });
      ops.appendChild(bNew);

      var bKnown = document.createElement("button");
      bKnown.className = "op known";
      bKnown.textContent = "熟词";
      bKnown.addEventListener("click", function () {
        setMark(x.w, "known");
        removeRow(item);
        toast("已标记为熟词");
      });
      ops.appendChild(bKnown);
    } else {
      var bOut = document.createElement("button");
      bOut.className = "op gray";
      bOut.textContent = "移出";
      bOut.addEventListener("click", function () {
        clearMark(x.w);
        removeRow(item);
        toast("已移出，回到待学");
      });
      ops.appendChild(bOut);
    }

    item.appendChild(left);
    item.appendChild(ops);
    return item;
  }

  function removeRow(item) {
    item.classList.add("out");
    setTimeout(function () {
      item.remove();
      renderStats();
      var rest = $("list").children.length;
      if (rest === 0) renderList();
    }, 180);
  }

  function renderList() {
    currentRows = buildRows();
    shown = 0;
    var list = $("list");
    list.textContent = "";
    $("count").textContent = currentRows.length
      ? (tab === "study" ? "待学 " : tab === "new" ? "生词 " : "熟词 ") + currentRows.length + " 个"
      : "";
    if (!currentRows.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = query
        ? "没有匹配的单词"
        : (tab === "study" ? "全部学完了 🎉 去生词本复习吧" : tab === "known" ? "还没有熟词" : "还没有生词");
      list.appendChild(e);
      $("more").hidden = true;
      renderStats();
      return;
    }
    appendPage();
    renderStats();
    setTimeout(fillViewport, 0);
  }

  function appendPage() {
    var frag = document.createDocumentFragment();
    var end = Math.min(shown + PAGE, currentRows.length);
    for (var i = shown; i < end; i++) frag.appendChild(makeItem(currentRows[i], tab !== "study"));
    $("list").appendChild(frag);
    shown = end;
    $("more").hidden = true;
  }

  /* ---------- tabs & sorting ---------- */
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]");
    if (!b) return;
    tab = b.dataset.tab;
    Array.prototype.forEach.call($("tabs").children, function (x) { x.classList.toggle("on", x === b); });
    renderList();
  });

  Array.prototype.forEach.call(document.querySelectorAll("[data-sort]"), function (b) {
    b.addEventListener("click", function () {
      sortMode = b.dataset.sort;
      Array.prototype.forEach.call(document.querySelectorAll("[data-sort]"), function (x) { x.classList.toggle("on", x === b); });
      renderList();
    });
  });

  var qTimer;
  $("q").addEventListener("input", function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(function () { query = $("q").value.trim(); renderList(); }, 160);
  });

  // 首屏内容不足一屏时继续补齐，保证可滚动
  function fillViewport(tries) {
    tries = tries || 0;
    if (tries > 30 || shown >= currentRows.length) return;
    if (document.documentElement.scrollHeight <= window.innerHeight + 80) {
      appendPage();
      fillViewport(tries + 1);
    }
  }

  // 滚动到底部自动加载下一批，无需点按钮
  var autoLoading = false;
  window.addEventListener("scroll", function () {
    if (autoLoading || shown >= currentRows.length) return;
    var doc = document.documentElement;
    if (window.innerHeight + window.scrollY >= doc.scrollHeight - 600) {
      autoLoading = true;
      appendPage();
      autoLoading = false;
    }
  }, { passive: true });

  /* ---------- toast ---------- */
  var toastTimer;
  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 1500);
  }

  /* ---------- import / export ---------- */
  $("btnExport").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "wordbook-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast("已导出 JSON");
  });
  $("btnImport").addEventListener("click", function () { $("fileImport").click(); });
  $("fileImport").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var p = JSON.parse(r.result);
        if (!p || !p.marks) throw new Error("格式不对");
        mergeInto(p);
        saveState(true);
        renderList();
        toast("导入成功，已合并");
      } catch (err) { toast("导入失败：" + err.message); }
      e.target.value = "";
    };
    r.readAsText(f, "utf-8");
  });

  function mergeInto(other) {
    var om = (other && other.marks) || {};
    Object.keys(om).forEach(function (k) {
      var a = state.marks[k], b = om[k];
      if (!b) return;
      if (!a || (b.t || 0) > (a.t || 0)) state.marks[k] = { s: b.s, t: b.t || 0 };
    });
  }

  /* ---------- github sync ---------- */
  var cfg = { repo: "", path: "wordbook.json", token: "" };
  try {
    var c = JSON.parse(localStorage.getItem(KEY_CFG) || "null");
    if (c) cfg = { repo: (c.repo || "").trim(), path: (c.path || "wordbook.json").trim(), token: (c.token || "") };
  } catch (e) {}
  // HTTP headers only accept ISO-8859-1; strip anything else (full-width spaces, smart quotes, …)
  function cleanAscii(str) { return String(str || "").replace(/[^\x21-\x7E]/g, "").trim(); }
  function saveCfg() { try { localStorage.setItem(KEY_CFG, JSON.stringify(cfg)); } catch (e) {} }
  function hasSync() { return !!(cfg.repo && cfg.token); }

  var ghSha = null;
  function ghHeaders() {
    return { Authorization: "Bearer " + cleanAscii(cfg.token), Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  }
  function b64encodeUtf8(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64decodeUtf8(b) { return decodeURIComponent(escape(atob(String(b).replace(/\s/g, "")))); }
  function ghUrl() { return "https://api.github.com/repos/" + cfg.repo + "/contents/" + encodeURI(cfg.path); }
  function friendlyErr(e) {
    var m = (e && e.message) || String(e);
    if (/ISO-8859-1/i.test(m)) return "Token 里有全角字符或中文标点，请重新粘贴（只保留 github_pat_ 开头的英文串）";
    if (/Failed to fetch|NetworkError|load failed/i.test(m)) return "网络连不上 GitHub（可能被墙或断网），稍后会自动重试";
    if (/401/.test(m)) return "Token 无效或已过期，请重新生成";
    if (/403/.test(m)) return "Token 权限不足（需要该仓库的 Contents: Read and write）";
    if (/404/.test(m)) return "仓库或分支不存在，检查 owner/repo 和 main 分支";
    return m;
  }
  function syncStatus(msg, cls) {
    var el = $("syncStatus"); if (!el) return;
    el.textContent = msg || ""; el.className = "status" + (cls ? " " + cls : "");
  }

  function pull() {
    if (!hasSync()) return Promise.resolve(false);
    syncStatus("正在拉取云端…");
    return fetch(ghUrl(), { headers: ghHeaders(), cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) { ghSha = null; syncStatus("云端还没有数据，稍后会自动创建", "ok"); return false; }
        if (!r.ok) throw new Error("读取失败 HTTP " + r.status);
        return r.json();
      })
      .then(function (data) {
        if (!data) return false;
        ghSha = data.sha;
        mergeInto(JSON.parse(b64decodeUtf8(data.content)));
        try { localStorage.setItem(KEY_STATE, JSON.stringify(state)); } catch (e) {}
        renderList();
        syncStatus("已拉取云端进度", "ok");
        return true;
      })
      .catch(function (e) { syncStatus("拉取失败：" + friendlyErr(e), "err"); return false; });
  }

  var pushTimer = null, pushing = false, pushAgain = false;
  function schedulePush() { if (!hasSync()) return; clearTimeout(pushTimer); pushTimer = setTimeout(push, 1500); }
  function push() {
    if (!hasSync()) return Promise.resolve();
    if (pushing) { pushAgain = true; return Promise.resolve(); }
    pushing = true;
    syncStatus("正在保存到云端…");
    var body = { message: "wordbook sync " + new Date().toISOString(), content: b64encodeUtf8(JSON.stringify(state)), branch: "main" };
    if (ghSha) body.sha = ghSha;
    return fetch(ghUrl(), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()), body: JSON.stringify(body) })
      .then(function (r) {
        if (r.ok) return r.json();
        if (r.status === 409 || r.status === 422) {
          return fetch(ghUrl(), { headers: ghHeaders(), cache: "no-store" })
            .then(function (x) { return x.ok ? x.json() : null; })
            .then(function (d) {
              if (!d) throw new Error("冲突且无法读取最新版本");
              ghSha = d.sha; body.sha = d.sha;
              return fetch(ghUrl(), { method: "PUT", headers: Object.assign({ "Content-Type": "application/json" }, ghHeaders()), body: JSON.stringify(body) })
                .then(function (r2) { if (!r2.ok) throw new Error("写入失败 HTTP " + r2.status); return r2.json(); });
            });
        }
        throw new Error("写入失败 HTTP " + r.status);
      })
      .then(function (res) { if (res && res.content) ghSha = res.content.sha; syncStatus("已保存到云端", "ok"); })
      .catch(function (e) { syncStatus("保存失败：" + friendlyErr(e), "err"); })
      .then(function () { pushing = false; if (pushAgain) { pushAgain = false; push(); } });
  }

  var sheet = $("sheet");
  $("btnSync").addEventListener("click", function () {
    $("syncRepo").value = cfg.repo;
    $("syncPath").value = cfg.path;
    $("syncToken").value = cfg.token;
    syncStatus(hasSync() ? "已配置" : "未配置", hasSync() ? "ok" : "");
    sheet.hidden = false;
  });
  $("btnSyncClose").addEventListener("click", function () { sheet.hidden = true; });
  sheet.addEventListener("click", function (e) { if (e.target === sheet) sheet.hidden = true; });
  $("btnSyncNow").addEventListener("click", function () {
    cfg.repo = $("syncRepo").value.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/, "").replace(/\/+$/, "");
    cfg.path = ($("syncPath").value.trim() || "wordbook.json").replace(/^\/+/, "");
    var rawTok = $("syncToken").value;
    cfg.token = cleanAscii(rawTok);
    if (cfg.token !== rawTok.trim()) {
      $("syncToken").value = cfg.token;
      if (!cfg.token) { syncStatus("Token 里全是非法字符，请重新粘贴（只能是英文数字下划线）", "err"); return; }
    }
    if (!/^[A-Za-z0-9_]+$/.test(cfg.token)) { syncStatus("Token 格式不对：只能是英文、数字、下划线", "err"); return; }
    if (!/^[A-Za-z0-9._-]+\/[A-Za-z0-9._-]+$/.test(cfg.repo)) { syncStatus("仓库格式应为 owner/repo（只能英文数字）", "err"); return; }
    saveCfg();
    if (!hasSync()) { syncStatus("仓库和 Token 都要填", "err"); return; }
    pull().then(function () { return push(); }).then(function () { toast("同步完成"); });
  });

  /* ---------- boot ---------- */
  loadState();
  renderList();
  if (hasSync()) pull();
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && hasSync()) pull();
  });
})();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  });
}
</script>
